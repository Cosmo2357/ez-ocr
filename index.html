<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ez-ocr</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="update-banner" class="banner" hidden>
      <span id="update-text">A new version is available</span>
      <button id="update-btn" class="btn btn-small">Update now</button>
      <button id="update-dismiss" class="btn btn-small btn-ghost">Later</button>
    </div>

    <header class="topbar">
      <h1>ez-ocr <span id="app-version" class="version"></span></h1>
      <div class="controls">
        <label for="lang">Language</label>
        <select id="lang">
          <option value="eng" selected>English</option>
          <option value="eng+jpn">English + Japanese</option>
          <option value="jpn">Japanese</option>
        </select>
      </div>
    </header>

    <main class="layout">
      <section class="pane">
        <div id="drop" class="drop" tabindex="0">
          <input id="file" type="file" accept="image/*" hidden />
          <img id="preview" alt="" hidden />
          <div id="placeholder" class="placeholder">
            <div class="placeholder-icon">🖼️</div>
            <p>Drop an image here</p>
            <p class="muted">Click to choose a file, or paste with Ctrl/Cmd+V</p>
            <p class="muted">Text is extracted automatically</p>
          </div>
        </div>
        <div class="row">
          <button id="run" class="btn btn-primary" disabled>Read again</button>
          <button id="clear" class="btn btn-ghost">Clear</button>
        </div>
        <div id="progress-wrap" class="progress-wrap" hidden>
          <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
          <div id="status" class="status muted"></div>
        </div>
      </section>

      <section class="pane">
        <textarea id="result" placeholder="Extracted text will appear here" spellcheck="false"></textarea>
        <div class="row">
          <button id="copy" class="btn btn-primary" disabled>Copy</button>
          <span id="copied" class="muted" hidden>Copied!</span>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
