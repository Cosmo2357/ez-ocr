<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ez-ocr</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="update-banner" class="banner" hidden>
      <span id="update-text">新しいバージョンがあります</span>
      <button id="update-btn" class="btn btn-small">今すぐ更新</button>
      <button id="update-dismiss" class="btn btn-small btn-ghost">あとで</button>
    </div>

    <header class="topbar">
      <h1>ez-ocr <span id="app-version" class="version"></span></h1>
      <div class="controls">
        <label for="lang">言語</label>
        <select id="lang">
          <option value="jpn+eng" selected>日本語 + 英語</option>
          <option value="jpn">日本語</option>
          <option value="eng">英語</option>
        </select>
      </div>
    </header>

    <main class="layout">
      <section class="pane">
        <div id="drop" class="drop" tabindex="0">
          <input id="file" type="file" accept="image/*" hidden />
          <img id="preview" alt="" hidden />
          <div id="placeholder" class="placeholder">
            <div class="placeholder-icon">🖼️</div>
            <p>画像をここにドロップ</p>
            <p class="muted">クリックしてファイルを選択、または Ctrl/Cmd+V で貼り付け</p>
            <p class="muted">ドロップすると自動で文字を読み取ります</p>
          </div>
        </div>
        <div class="row">
          <button id="run" class="btn btn-primary" disabled>もう一度読み取る</button>
          <button id="clear" class="btn btn-ghost">クリア</button>
        </div>
        <div id="progress-wrap" class="progress-wrap" hidden>
          <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
          <div id="status" class="status muted"></div>
        </div>
      </section>

      <section class="pane">
        <textarea id="result" placeholder="読み取ったテキストがここに表示されます" spellcheck="false"></textarea>
        <div class="row">
          <button id="copy" class="btn btn-primary" disabled>コピー</button>
          <span id="copied" class="muted" hidden>コピーしました</span>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
