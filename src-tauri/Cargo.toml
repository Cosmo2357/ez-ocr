[package]
name = "ez-ocr"
version = "0.1.0"
description = "Simple OCR app: extract text from images"
authors = ["Cosmo2357"]
edition = "2021"

[lib]
name = "ez_ocr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
