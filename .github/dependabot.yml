# GitHub Actions の部品はコミットの ID で固定している (中身を差し替えられないように)。
# 固定したままだと古くなるので、週に 1 回、新しい版への更新を Pull Request で提案してもらう。
# npm と Rust (Cargo) の部品も同じ。Dependabot は GitHub 側で動くので、Actions の時間は使わない。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
    # tauri-action 1.0 は設定の名前が変わる (includeUpdaterJson → uploadUpdaterJson など)。タグを打たないと試せないので、release.yml を直してから手で上げる
    ignore:
      - dependency-name: "tauri-apps/tauri-action"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      deps:
        patterns: ["*"]
    cooldown:
      default-days: 7
    # vite 8 は esbuild を別に入れないとビルドが通らない。tesseract.js は public/tesseract の手元のファイルと版を揃える必要がある。試して確かめてから手で上げる
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tesseract.js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      deps:
        patterns: ["*"]
    cooldown:
      default-days: 7
